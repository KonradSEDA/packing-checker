<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Packing Checker</title>
    <!-- Biblioteka do skanowania -->
    <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: #f4f4f9; }
        #reader { width: 100%; max-width: 500px; margin: 0 auto; background: #fff; padding: 10px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        #result { margin-top: 20px; font-size: 16px; padding: 15px; border-radius: 8px; display: inline-block; width: 100%; max-width: 600px; box-sizing: border-box; text-align: left; }
        .found { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .not-found { background-color: #f8d4d4; color: #721c24; border: 1px solid #f5c6cb; text-align: center; }
        .item-row { display: flex; align-items: center; margin-bottom: 12px; border-bottom: 1px solid #c3e6cb; padding-bottom: 12px; }
        .item-row img { width: 60px; height: 60px; object-fit: cover; margin-right: 15px; border-radius: 4px; border: 1px solid #ccc; background: #fff; }
        .search-box { margin-top: 20px; }
        input[type="text"] { padding: 8px; font-size: 16px; width: 220px; border: 1px solid #ccc; border-radius: 4px; }
        button { padding: 8px 15px; font-size: 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; margin-left: 5px; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>

    <h1>Sprawdzanie Zamówień</h1>
    
    <!-- Element kamery -->
    <div id="reader"></div>

    <div class="search-box">
        <input type="text" id="manualInput" placeholder="Wpisz kod ręcznie...">
        <button onclick="searchManual()">Sprawdź</button>
    </div>

    <div id="result"></div>

    <script>
        const CLOUD_FUNCTION_URL = "https://europe-central2-bazadanycherpwannabe.cloudfunctions.net/check-order";
        let isScanning = true;

        function fetchOrderData(code) {
            const resultDiv = document.getElementById('result');
            resultDiv.className = "";
            resultDiv.innerText = "Sprawdzanie w bazie...";

            fetch(`${CLOUD_FUNCTION_URL}?barcode=${encodeURIComponent(code)}`)
                .then(response => response.json())
                .then(data => {
                    if (data.status === "found") {
                        resultDiv.className = "found";
                        let html = `<b>Znaleziono zamówienie! Liczba pozycji: ${data.items.length}</b><br><hr>`;
                        
                        data.items.forEach(item => {
                            let imageUrl = item.image_url || '';

                            html += `
                                <div class="item-row" style="display: flex; align-items: center; margin-bottom: 15px; border-bottom: 1px solid #ddd; padding-bottom: 10px;">
                                    <img src="${imageUrl}" style="width: 70px; height: 70px; object-fit: cover; border: 1px solid #999; margin-right: 15px; background: #fff;" alt="foto" onerror="this.style.display='none'">
                                    <div>
                                        <small>Zamówienie: <b>${item.orderNumber}</b></small><br>
                                        <small>Produkt (Barcode): <b>${item.barcode}</b></small><br>
                                        <small>Plik: <b>${item.image_filename}</b></small>
                                    </div>
                                </div>`;
                        });
                        resultDiv.innerHTML = html;
                    } else {
                        resultDiv.className = "not-found";
                        resultDiv.innerText = `Brak w bazie dla kodu: ${code}`;
                    }
                })
                .catch(error => {
                    resultDiv.className = "not-found";
                    resultDiv.innerText = "Błąd połączenia z chmurą!";
                    console.error(error);
                });
        }

        function searchManual() {
            const val = document.getElementById('manualInput').value.trim();
            if (val) {
                fetchOrderData(val);
            }
        }

        // Obsługa klawisza Enter w polu tekstowym
        document.getElementById("manualInput").addEventListener("keypress", function(event) {
            if (event.key === "Enter") {
                searchManual();
            }
        });

        function onScanSuccess(decodedText, decodedResult) {
            if (!isScanning) return;
            isScanning = false;
            
            document.getElementById('manualInput').value = decodedText;
            fetchOrderData(decodedText);

            setTimeout(() => { isScanning = true; }, 3000);
        }

        // Uruchomienie skanera aparatu ze stabilną konfiguracją
        const html5QrCode = new Html5Qrcode("reader");
        
        const qrConfig = { 
            fps: 20, 
            qrbox: { width: 300, height: 150 }
        };

        html5QrCode.start(
            { facingMode: "environment" }, 
            qrConfig, 
            onScanSuccess
        ).catch(err => {
            console.error("Błąd startu kamery:", err);
            document.getElementById('result').innerText = "Kamera niedostępna (wymagany HTTPS). Użyj wpisywania ręcznego.";
        });
    </script>
</body>
</html>
